# ============================================================================
# PRODUCTION ENVIRONMENT CONFIGURATION
# ============================================================================

# Database - Use environment variables
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Hibernate - Optimized for production
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.generate_statistics=false

# Logging - Production level
logging.level.root=WARN
logging.level.com.sujal.itsm=INFO
logging.level.org.springframework.security=WARN

# Actuator - Limited exposure
management.endpoints.web.exposure.include=health,info,metrics,prometheus

# Security - Strong settings
security.remember-me.key=${REMEMBER_ME_KEY}
security.bcrypt.strength=14

# Email - Use environment variables
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

# Compression - Enable
server.compression.enabled=true

# Session - Secure cookies
server.servlet.session.cookie.secure=true