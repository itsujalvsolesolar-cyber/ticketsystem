# ============================================================================
# DEVELOPMENT ENVIRONMENT CONFIGURATION
# ============================================================================

# Database - Use local MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/ticketsystem_dev?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=admin123

# Hibernate - Show SQL in dev
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.generate_statistics=true

# Logging - Debug level
logging.level.com.sujal.itsm=DEBUG
logging.level.org.springframework.security=DEBUG

# DevTools
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# Disable caching in dev
spring.cache.type=none

# Actuator - Expose all endpoints
management.endpoints.web.exposure.include=*

# Email - Use mock in dev
app.email.enabled=false

# Security - Relaxed for dev
security.remember-me.key=dev-secret-key