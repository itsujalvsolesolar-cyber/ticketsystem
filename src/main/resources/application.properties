# ============================================================================
# ENTERPRISE IT TICKETING SYSTEM - APPLICATION CONFIGURATION
# ============================================================================
# Version: 2.0.0
# Last Updated: 2026-06-30
# Environment: Production-Ready Configuration
# ============================================================================

# ============================================================================
# APPLICATION METADATA
# ============================================================================
spring.application.name=IT-Ticket-System
spring.application.version=2.0.0
info.app.name=Enterprise IT Ticketing System
info.app.description=Production-grade IT Support Ticket Management System
info.app.version=2.0.0
info.app.encoding=UTF-8
info.app.java.version=21

# ============================================================================
# SERVER CONFIGURATION
# ============================================================================
server.port=9090
server.servlet.context-path=/
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.name=JSESSIONID

# --- SSL Configuration ---
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-password=itsm2026
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=itsm

# Server Compression (GZIP)
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css
server.compression.min-response-size=1024

# Server Shutdown
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Server Error Handling
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.whitelabel.enabled=false

# ============================================================================
# DATABASE CONFIGURATION
# ============================================================================
# MySQL Database - Using Environment Variables for Security
spring.datasource.url=jdbc:mysql://localhost:3306/ticketsystem_v2?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:admin123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool Configuration (Enterprise-Grade)
spring.datasource.hikari.pool-name=TicketSystem-HikariPool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.initialization-fail-timeout=1
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.connection-test-query=SELECT 1

# ============================================================================
# JPA / HIBERNATE CONFIGURATION
# ============================================================================
#spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.use_sql_comments=false

# Hibernate Performance Optimization
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.properties.hibernate.generate_statistics=false
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=false

# Hibernate Connection Handling
spring.jpa.properties.hibernate.connection.handling_mode=DELAYED_ACQUISITION_AND_RELEASE_AFTER_TRANSACTION

# ============================================================================
# FILE UPLOAD CONFIGURATION
# ============================================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.file-size-threshold=2KB
spring.servlet.multipart.location=${java.io.tmpdir}

# File Upload Directory
app.upload.dir=uploads
app.upload.allowed-extensions=jpg,jpeg,png,gif,pdf,doc,docx,xls,xlsx,txt,zip
app.upload.max-files-per-request=10

# ============================================================================
# EMAIL CONFIGURATION
# ============================================================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:it.sujal.vsolesolar@gmail.com}
spring.mail.password=${MAIL_PASSWORD:jpwf fcsn xdbs blpj}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Email Defaults
app.email.from=noreply@ticketsystem.com
app.email.reply-to=support@ticketsystem.com
app.email.enabled=true

# ============================================================================
# SECURITY CONFIGURATION
# ============================================================================
# Remember-Me Settings
security.remember-me.key=${REMEMBER_ME_KEY:enterprise-ticket-system-secret-key-2026-change-in-production}
security.remember-me.token-validity-seconds=2592000

# Session Management
security.session.max-sessions=1
security.session.expired-url=/login?expired

# Password Encoding
security.bcrypt.strength=12

# CSRF Configuration
security.csrf.enabled=true
security.csrf.cookie-name=CSRF-TOKEN

# ============================================================================
# ACTUATOR CONFIGURATION (MONITORING & HEALTH)
# ============================================================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus,env,beans,mappings,threaddump,heapdump
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
management.endpoint.info.enabled=true
management.endpoint.metrics.enabled=true
management.endpoint.prometheus.enabled=true

# Health Indicators
management.health.db.enabled=true
management.health.diskSpace.enabled=true
management.health.mail.enabled=true
management.health.ping.enabled=true

# Health Status HTTP Mapping
management.health.status.http-mapping.FATAL=503
management.health.status.http-mapping.ERROR=503
management.health.status.http-mapping.DOWN=503
management.health.status.http-mapping.OUT_OF_SERVICE=503
management.health.status.http-mapping.UP=200

# Metrics Configuration
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=10ms,50ms,100ms,200ms,500ms,1s,2s,5s

# ============================================================================
# LOGGING CONFIGURATION
# ============================================================================
logging.level.root=INFO
logging.level.com.sujal.itsm=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.org.springframework.web=INFO
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=DEBUG
logging.level.com.zaxxer.hikari=INFO

# Log Pattern
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Log File Configuration
logging.file.name=logs/ticketsystem.log
logging.file.max-size=10MB
logging.file.max-history=30
logging.file.total-size-cap=1GB

# ============================================================================
# CACHE CONFIGURATION
# ============================================================================
spring.cache.type=simple
spring.cache.cache-names=tickets,users,departments,categories,legacyTicketNotificationServices
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=600s

# ============================================================================
# WEBSOCKET CONFIGURATION
# ============================================================================
websocket.endpoint=/ws

# Comma-separated list of allowed origins (CRITICAL FOR SECURITY)
websocket.allowed-origins=http://localhost:9090,http://your-production-domain.com

# Heartbeat interval in milliseconds (detects dead connections)
websocket.heartbeat-interval=25000

# Maximum incoming message size in bytes (128 KB)
websocket.message-size-limit=131072

# ============================================================================
# API DOCUMENTATION (SPRINGDOC OPENAPI)
# ============================================================================
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.filter=true
springdoc.default-produces-media-type=application/json
springdoc.default-consumes-media-type=application/json

# ============================================================================
# ASYNC CONFIGURATION
# ============================================================================
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=20
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=TicketSystem-Async-

spring.task.scheduling.pool.size=5
spring.task.scheduling.thread-name-prefix=TicketSystem-Scheduler-

# ============================================================================
# INTERNATIONALIZATION
# ============================================================================
spring.messages.basename=messages/messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false
spring.messages.use-code-as-default-message=true

# ============================================================================
# JACKSON (JSON) CONFIGURATION
# ============================================================================
#spring.jackson.serialization.fail-on-empty-beans=false
#spring.jackson.deserialization.fail-on-unknown-properties=false
#spring.jackson.time-zone=Asia/Kolkata
#spring.jackson.date-format=yyyy-MM-dd HH:mm:ss

# ============================================================================
# CORS CONFIGURATION
# ============================================================================
app.cors.allowed-origins=http://localhost:9090,http://localhost:3000
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
app.cors.allowed-headers=*
app.cors.allow-credentials=true
app.cors.max-age=3600

# ============================================================================
# RATE LIMITING
# ============================================================================
app.rate-limit.enabled=true
app.rate-limit.requests-per-minute=100
app.rate-limit.burst-size=20

# ============================================================================
# APPLICATION-SPECIFIC SETTINGS
# ============================================================================
# SLA Configuration (in hours)
app.sla.high-priority=4
app.sla.medium-priority=8
app.sla.low-priority=24

# Notification Settings
app.legacyTicketNotificationService.max-recent=50
app.legacyTicketNotificationService.websocket-enabled=true

# Dashboard Settings
app.dashboard.default-page-size=10
app.dashboard.max-page-size=100

# Export Settings
app.export.max-records=10000
app.export.default-format=csv

# ============================================================================
# DEVELOPMENT SETTINGS (Only active in dev profile)
# ============================================================================
# spring.devtools.restart.enabled=true
# spring.devtools.livereload.enabled=true
# spring.devtools.restart.additional-paths=src/main/java
# spring.devtools.restart.exclude=static/**,public/**,templates/**

# ============================================================================
# FEATURE FLAGS
# ============================================================================
app.features.email-legacyTicketNotificationServices=true
app.features.websocket-legacyTicketNotificationServices=true
app.features.file-uploads=true
app.features.export-csv=true
app.features.audit-logging=true
app.features.two-factor-auth=false
app.features.dark-mode=true
app.features.command-palette=true

# ============================================================================
# DATA SEEDING CONFIGURATION
# ============================================================================
# Enable or disable database seeding on startup (set to false in production after first run)
app.seeding.enabled=true

# Default passwords for seeded users (Change these in production!)
app.seeding.admin.password=admin123
app.seeding.manager.password=manager123
app.seeding.agent.password=1234

# ============================================================================
# END OF CONFIGURATION
# ============================================================================



app.seeding.force-password-reset=true