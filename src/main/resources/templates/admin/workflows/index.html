<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Workflow Builder')}"></head>
<body>
<div th:replace="~{fragments/layout :: sidebar}"></div>

<main class="main-content">
    <div class="page-header mb-4">
        <div class="d-flex justify-content-between align-items-center">
            <div>
                <h1 class="h3 fw-bold mb-1">Workflow Builder</h1>
                <p class="text-secondary mb-0">Configure approval chains for different modules</p>
            </div>
            <a href="/admin/workflows/new" class="btn btn-primary">
                <i class="bi bi-plus-circle me-2"></i>New Workflow
            </a>
        </div>
    </div>

    <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
        <i class="bi bi-check-circle me-2"></i><span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
        <i class="bi bi-exclamation-triangle me-2"></i><span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="bg-light">
                    <tr>
                        <th class="ps-4">Workflow Name</th>
                        <th>Module</th>
                        <th>Steps</th>
                        <th>Status</th>
                        <th class="text-end pe-4">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="wf : ${workflows}">
                        <td class="ps-4 fw-semibold" th:text="${wf.name}">Name</td>
                        <td><span class="badge bg-primary-subtle text-primary-emphasis" th:text="${wf.moduleType}">MODULE</span></td>
                        <td th:text="${wf.steps != null ? wf.steps.size() : 0}">0</td>
                        <td>
                            <span th:if="${wf.isActive}" class="badge bg-success-subtle text-success-emphasis">Active</span>
                            <span th:unless="${wf.isActive}" class="badge bg-secondary-subtle text-secondary-emphasis">Inactive</span>
                        </td>
                        <td class="text-end pe-4">
                            <a th:href="@{/admin/workflows/{id}/edit(id=${wf.id})}" class="btn btn-sm btn-outline-primary me-1">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <form th:action="@{/admin/workflows/{id}/toggle(id=${wf.id})}" method="post" class="d-inline">
                                <button type="submit" class="btn btn-sm" th:classappend="${wf.isActive} ? 'btn-outline-warning' : 'btn-outline-success'">
                                    <i class="bi" th:classappend="${wf.isActive} ? 'bi-pause-fill' : 'bi-play-fill'"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(workflows)}">
                        <td colspan="5" class="text-center py-4 text-secondary">No workflows configured yet.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
