<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${pageTitle})}"></head>
<body>
<div th:replace="~{fragments/layout :: sidebar}"></div>

<main class="main-content">
    <div class="page-header mb-4">
        <nav aria-label="breadcrumb" class="mb-3">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/admin/workflows">Workflows</a></li>
                <li class="breadcrumb-item active" th:text="${workflow.id != null ? 'Edit' : 'New'}">Action</li>
            </ol>
        </nav>
        <h1 class="h3 fw-bold mb-1" th:text="${pageTitle}">Title</h1>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body p-4">
            <form th:action="${workflow.id != null} ? @{/admin/workflows/{id}(id=${workflow.id})} : @{/admin/workflows/new}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Workflow Name <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" name="name" th:value="${workflow.name}" required placeholder="e.g., Standard NAS Access">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Module Type <span class="text-danger">*</span></label>
                        <select class="form-select" name="moduleType" required>
                            <option value="">Select Module</option>
                            <option th:each="type : ${moduleTypes}" th:value="${type}" th:text="${type}" th:selected="${workflow.moduleType == type}"></option>
                        </select>
                    </div>
                    <div class="col-12">
                        <label class="form-label fw-semibold">Description</label>
                        <textarea class="form-control" name="description" rows="2" th:text="${workflow.description}"></textarea>
                    </div>
                </div>

                <hr class="my-4">
                <h5 class="mb-3">Approval Steps</h5>
                <p class="text-muted small">Define the sequence of approvers. The first step is executed first.</p>

                <div id="steps-container">
                    <div class="row g-3 mb-3 step-row" th:each="step, iterStat : ${steps}">
                        <div class="col-md-1 d-flex align-items-center">
                            <span class="badge bg-secondary rounded-pill" th:text="${iterStat.index + 1}">1</span>
                        </div>
                        <div class="col-md-10">
                            <select class="form-select" name="stepRoles" required>
                                <option value="">Select Approver Role</option>
                                <option th:each="role : ${roles}" th:value="${role.name}" th:text="${role.name}" th:selected="${step.approverRole == role.name}"></option>
                            </select>
                        </div>
                        <div class="col-md-1 d-flex align-items-center">
                            <button type="button" class="btn btn-outline-danger btn-sm remove-step" th:if="${iterStat.index > 0}">
                                <i class="bi bi-trash"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <button type="button" class="btn btn-outline-primary btn-sm mt-2" id="add-step-btn">
                    <i class="bi bi-plus-circle me-1"></i> Add Another Step
                </button>

                <div class="d-flex justify-content-end gap-2 mt-5 pt-3 border-top">
                    <a href="/admin/workflows" class="btn btn-outline-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary">Save Workflow</button>
                </div>
            </form>
        </div>
    </div>
</main>

<!-- ✅ HIDDEN TEMPLATE FOR CLONING (Thymeleaf will render the roles here perfectly) -->
<div id="step-template" style="display: none;">
    <div class="row g-3 mb-3 step-row">
        <div class="col-md-1 d-flex align-items-center">
            <span class="badge bg-secondary rounded-pill step-number">1</span>
        </div>
        <div class="col-md-10">
            <select class="form-select" name="stepRoles" required>
                <option value="">Select Approver Role</option>
                <option th:each="role : ${roles}" th:value="${role.name}" th:text="${role.name}"></option>
            </select>
        </div>
        <div class="col-md-1 d-flex align-items-center">
            <button type="button" class="btn btn-outline-danger btn-sm remove-step">
                <i class="bi bi-trash"></i>
            </button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.getElementById('add-step-btn').addEventListener('click', function() {
        const container = document.getElementById('steps-container');

        // Clone the hidden template
        const template = document.getElementById('step-template').firstElementChild.cloneNode(true);

        // Update the step number dynamically
        const count = container.children.length + 1;
        template.querySelector('.step-number').textContent = count;

        // Append to the container
        container.appendChild(template);

        // Re-attach remove listeners to the new button
        attachRemoveListeners();
    });

    function attachRemoveListeners() {
        document.querySelectorAll('.remove-step').forEach(btn => {
            // Remove existing listeners to prevent duplicates
            btn.replaceWith(btn.cloneNode(true));
        });

        document.querySelectorAll('.remove-step').forEach(btn => {
            btn.addEventListener('click', function() {
                this.closest('.step-row').remove();

                // Re-number all badges after removal
                document.querySelectorAll('.step-row').forEach((row, idx) => {
                    row.querySelector('.step-number').textContent = idx + 1;
                });
            });
        });
    }

    // Initialize listeners on page load
    attachRemoveListeners();
</script>
</body>
</html>
