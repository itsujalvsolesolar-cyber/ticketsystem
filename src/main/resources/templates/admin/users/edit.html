<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${pageTitle})}"></head>
<body>
<div th:replace="~{fragments/layout :: sidebar}"></div>

<main class="main-content">
    <div class="page-header mb-4">
        <nav aria-label="breadcrumb" class="mb-3">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/admin/settings">Settings</a></li>
                <li class="breadcrumb-item active">Edit User</li>
            </ol>
        </nav>

        <h1 class="h3 fw-bold mb-1">Edit User</h1>
        <p class="text-secondary mb-0">Update user information and permissions</p>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body p-4">
            <form th:action="@{/admin/users/{id}/update(id=${user.id})}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <div class="row g-3">
                    <!-- Username -->
                    <div class="col-md-6">
                        <label for="username" class="form-label fw-semibold">Username <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="username" name="username"
                               th:value="${user.username}" required>
                    </div>

                    <!-- Email -->
                    <div class="col-md-6">
                        <label for="email" class="form-label fw-semibold">Email <span class="text-danger">*</span></label>
                        <input type="email" class="form-control" id="email" name="email"
                               th:value="${user.email}" required>
                    </div>

                    <!-- Password (Optional) -->
                    <div class="col-md-6">
                        <label for="password" class="form-label fw-semibold">New Password</label>
                        <input type="password" class="form-control" id="password" name="password"
                               placeholder="Leave blank to keep current password">
                        <div class="form-text">Leave blank to keep the current password</div>
                    </div>

                    <!-- Role -->
                    <div class="col-md-6">
                        <label for="roleId" class="form-label fw-semibold">Role <span class="text-danger">*</span></label>
                        <select class="form-select" id="roleId" name="roleId" required>
                            <option th:each="role : ${roles}"
                                    th:value="${role.id}"
                                    th:text="${role.name}"
                                    th:selected="${user.roles.contains(role)}">
                            </option>
                        </select>
                    </div>

                    <!-- Department -->
                    <div class="col-md-6">
                        <label for="departmentId" class="form-label fw-semibold">Department</label>
                        <select class="form-select" id="departmentId" name="departmentId">
                            <option value="">Select Department</option>
                            <option th:each="dept : ${departments}"
                                    th:value="${dept.id}"
                                    th:text="${dept.name}"
                                    th:selected="${user.department != null and user.department.id == dept.id}">
                            </option>
                        </select>
                    </div>

                    <!-- Status -->
                    <div class="col-md-6">
                        <label class="form-label fw-semibold d-block">Status</label>
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" id="isActive" name="isActive"
                                   th:checked="${user.isActive}">
                            <label class="form-check-label" for="isActive">Active User</label>
                        </div>
                    </div>
                </div>

                <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                    <a href="/admin/settings" class="btn btn-outline-secondary">
                        <i class="bi bi-x-circle me-2"></i>Cancel
                    </a>
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-circle me-2"></i>Update User
                    </button>
                </div>
            </form>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
