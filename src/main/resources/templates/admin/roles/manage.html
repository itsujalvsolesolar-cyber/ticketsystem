<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${pageTitle})}"></head>
<body>
<div th:replace="~{fragments/layout :: sidebar}"></div>

<main class="main-content">
    <div class="page-header mb-4">
        <nav aria-label="breadcrumb" class="mb-3">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/admin/settings" class="text-decoration-none">Settings</a></li>
                <li class="breadcrumb-item active">Manage Permissions</li>
            </ol>
        </nav>

        <div class="d-flex justify-content-between align-items-start">
            <div>
                <h1 class="h3 fw-bold mb-1" th:text="${role.name}">Role Name</h1>
                <p class="text-secondary mb-0" th:text="${role.description}">Role description goes here.</p>
            </div>
            <span th:if="${role.isSystemRole}" class="badge bg-warning-subtle text-warning-emphasis fs-6">
                <i class="bi bi-shield-lock me-1"></i>System Role
            </span>
        </div>
    </div>

    <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
        <i class="bi bi-check-circle me-2"></i><span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <form th:action="@{/admin/roles/{id}/permissions(id=${role.id})}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

        <div class="card border-0 shadow-sm">
            <div class="card-body p-4">

                <!-- Iterate over modules -->
                <div th:each="moduleEntry : ${permissionsByModule}" class="mb-5">
                    <div class="d-flex justify-content-between align-items-center mb-3 pb-2 border-bottom">
                        <h4 class="h5 fw-bold mb-0 text-uppercase text-secondary" th:text="${moduleEntry.key}">MODULE</h4>
                        <div class="form-check">
                            <input class="form-check-input select-all-module" type="checkbox" th:data-module="${moduleEntry.key}">
                            <label class="form-check-label text-muted small">Select All in Module</label>
                        </div>
                    </div>

                    <div class="row g-3">
                        <div class="col-md-6 col-lg-4" th:each="perm : ${moduleEntry.value}">
                            <div class="form-check p-3 border rounded hover-bg-light d-flex align-items-start">
                                <input class="form-check-input mt-1" type="checkbox"
                                       name="permissionIds"
                                       th:value="${perm.id}"
                                       th:id="'perm-' + ${perm.id}"
                                       th:checked="${role.permissions.contains(perm)}"
                                       th:disabled="${role.isSystemRole and perm.code == 'system:role.manage'}">
                                <label class="form-check-label w-100 ms-2" th:for="'perm-' + ${perm.id}">
                                    <div class="fw-semibold text-dark" th:text="${perm.name}">Permission Name</div>
                                    <div class="small text-muted font-monospace" th:text="${perm.code}">permission.code</div>
                                </label>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                    <a th:href="@{/admin/settings}" class="btn btn-outline-secondary">
                        <i class="bi bi-x-circle me-2"></i>Cancel
                    </a>
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-circle me-2"></i>Save Permissions
                    </button>
                </div>
            </div>
        </div>
    </form>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Select All functionality per module
    document.addEventListener('DOMContentLoaded', function() {
        document.querySelectorAll('.select-all-module').forEach(checkbox => {
            checkbox.addEventListener('change', function() {
                const parent = this.closest('.mb-5');
                const permCheckboxes = parent.querySelectorAll('input[name="permissionIds"]');
                permCheckboxes.forEach(cb => {
                    if (!cb.disabled) {
                        cb.checked = this.checked;
                    }
                });
            });
        });
    });
</script>
</body>
</html>
