<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${pageTitle})}"></head>
<body>
<div th:replace="~{fragments/layout :: sidebar}"></div>

<main class="main-content">
    <div class="page-header mb-4">
        <a th:href="@{/offboarding/dashboard}" class="btn btn-sm btn-outline-secondary mb-3">
            <i class="bi bi-arrow-left me-1"></i> Back to Dashboard
        </a>
        <h1 class="h3 fw-bold mb-1" th:text="${request.employee.fullName} + ' - Offboarding Details'">Details</h1>
        <p class="text-secondary mb-0">Last Working Day: <span th:text="${#temporals.format(request.lastWorkingDay, 'dd MMM yyyy')}">Date</span></p>
    </div>

    <div class="row g-4">
        <!-- Clearance Checklist -->
        <div class="col-md-8">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-header bg-white py-3">
                    <h5 class="mb-0 fw-semibold">Departmental Clearances</h5>
                </div>
                <div class="card-body">
                    <div th:each="clearance : ${clearances}" class="mb-4 p-3 border rounded bg-light">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <h6 class="fw-bold mb-0" th:text="${clearance.department} + ' Clearance'">Department</h6>
                            <span th:if="${clearance.status.name() == 'CLEARED'}" class="badge bg-success">Cleared</span>
                            <span th:if="${clearance.status.name() == 'PENDING'}" class="badge bg-warning text-dark">Pending</span>
                            <span th:if="${clearance.status.name() == 'REJECTED'}" class="badge bg-danger">Rejected</span>
                        </div>

                        <div th:if="${clearance.status.name() == 'CLEARED'}" class="small text-muted">
                            <p class="mb-1"><strong>Cleared By:</strong> <span th:text="${clearance.clearedBy.fullName}">Name</span></p>
                            <p class="mb-1"><strong>Remarks:</strong> <span th:text="${clearance.remarks}">Remarks</span></p>
                            <p class="mb-0"><strong>Signed:</strong> <span th:text="${#temporals.format(clearance.clearedAt, 'dd MMM yyyy, HH:mm')}">Date</span></p>
                            <!-- Show Signature Image -->
                            <img th:if="${clearance.signatureData != null}" th:src="${clearance.signatureData}" alt="Signature" style="max-height: 60px; border: 1px solid #ccc; background: white; margin-top: 5px;">
                        </div>

                        <!-- Signature Action Button (Only show if PENDING and user has role) -->
                        <div th:if="${clearance.status.name() == 'PENDING'}">
                            <button class="btn btn-sm btn-primary mt-2"
                                    th:onclick="'openSignatureModal(' + ${clearance.id} + ', \'' + ${clearance.department} + '\')'">
                                <i class="bi bi-pen me-1"></i> Sign & Clear
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Asset Returns -->
        <div class="col-md-4">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-header bg-white py-3">
                    <h5 class="mb-0 fw-semibold">Asset Recovery</h5>
                </div>
                <div class="card-body">
                    <div th:each="record : ${assetReturns}" class="mb-3 p-3 border rounded">
                        <h6 class="fw-bold mb-1" th:text="${record.asset.assetTag}">TAG-001</h6>
                        <p class="small text-muted mb-1" th:text="${record.asset.name}">Asset Name</p>
                        <span th:if="${record.status.name() == 'RETURNED'}" class="badge bg-success">Returned</span>
                        <span th:if="${record.status.name() == 'PENDING'}" class="badge bg-warning text-dark">Pending</span>
                        <span th:if="${record.status.name() == 'LOST'}" class="badge bg-danger">Lost</span>
                    </div>
                    <div th:if="${#lists.isEmpty(assetReturns)}" class="text-center text-muted py-4">
                        No assets assigned to this employee.
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<!-- Signature Modal (Phase 10 Integration) -->
<div class="modal fade" id="signatureModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalTitle">Sign Clearance</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="clearanceId">
                <div class="mb-3">
                    <label class="form-label">Remarks / Notes</label>
                    <textarea class="form-control" id="clearanceRemarks" rows="3" placeholder="e.g., All assets returned in good condition."></textarea>
                </div>
                <label class="form-label fw-semibold">Digital Signature</label>
                <canvas id="signaturePad" width="400" height="200" style="border: 2px dashed #ccc; border-radius: 8px; background: #fff; cursor: crosshair;"></canvas>
                <div class="mt-2 d-flex justify-content-between">
                    <button type="button" class="btn btn-sm btn-outline-secondary" onclick="clearSignature()">Clear</button>
                    <small class="text-muted">Draw your signature above</small>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-success" onclick="submitClearance()">
                    <i class="bi bi-check-circle me-1"></i> Submit & Sign
                </button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // ============================================
    // SIGNATURE PAD LOGIC (Phase 10)
    // ============================================
    const canvas = document.getElementById('signaturePad');
    const ctx = canvas.getContext('2d');
    let isDrawing = false;

    // Mouse events
    canvas.addEventListener('mousedown', startDrawing);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', stopDrawing);
    canvas.addEventListener('mouseout', stopDrawing);

    // Touch events (for mobile/tablet)
    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); startDrawing(e.touches[0]); });
    canvas.addEventListener('touchmove', (e) => { e.preventDefault(); draw(e.touches[0]); });
    canvas.addEventListener('touchend', stopDrawing);

    function startDrawing(e) {
        isDrawing = true;
        ctx.beginPath();
        ctx.moveTo(getX(e), getY(e));
    }

    function draw(e) {
        if (!isDrawing) return;
        ctx.lineWidth = 2;
        ctx.lineCap = 'round';
        ctx.strokeStyle = '#000';
        ctx.lineTo(getX(e), getY(e));
        ctx.stroke();
    }

    function stopDrawing() {
        isDrawing = false;
    }

    function getX(e) {
        const rect = canvas.getBoundingClientRect();
        return (e.clientX || e.pageX) - rect.left;
    }

    function getY(e) {
        const rect = canvas.getBoundingClientRect();
        return (e.clientY || e.pageY) - rect.top;
    }

    function clearSignature() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    function openSignatureModal(clearanceId, department) {
        document.getElementById('clearanceId').value = clearanceId;
        document.getElementById('modalTitle').innerText = 'Sign ' + department + ' Clearance';
        clearSignature();
        document.getElementById('clearanceRemarks').value = '';
        new bootstrap.Modal(document.getElementById('signatureModal')).show();
    }

    function submitClearance() {
        const clearanceId = document.getElementById('clearanceId').value;
        const remarks = document.getElementById('clearanceRemarks').value;
        const signatureData = canvas.toDataURL(); // Get Base64 image

        if (signatureData === canvas.toDataURL('image/png', 0) && ctx.getImageData(0, 0, canvas.width, canvas.height).data.every(val => val === 0)) {
            alert('Please draw your signature before submitting.');
            return;
        }

        const payload = {
            clearanceId: clearanceId,
            status: 'CLEARED',
            remarks: remarks,
            signatureData: signatureData
        };

        // Get CSRF Token
        const csrfToken = document.querySelector('meta[name="_csrf"]')?.getAttribute('content');
        const csrfHeader = document.querySelector('meta[name="_csrf_header"]')?.getAttribute('content');

        fetch('/api/offboarding/clearance/submit', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                [csrfHeader]: csrfToken
            },
            body: JSON.stringify(payload)
        })
            .then(response => {
                if (response.ok) {
                    alert('Clearance signed successfully! Automated cleanup triggered.');
                    window.location.reload(); // Reload to show updated status
                } else {
                    alert('Failed to submit clearance.');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('An error occurred.');
            });
    }
</script>
</body>
</html>
