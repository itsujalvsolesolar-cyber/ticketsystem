<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - IT Support</title>

    <!-- Bootstrap 5.3 (Native Dark Mode Support) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Premium SaaS Font (Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* ============================================
           1. DESIGN TOKENS (Matches layout.html)
           ============================================ */
        :root {
            --bg-body: #f8fafc;
            --bg-surface: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --border-color: #e2e8f0;
            --accent-primary: #2563eb;
            --accent-hover: #1d4ed8;
            --shadow-lg: 0 20px 25px -5px rgb(0 0 0 / 0.05), 0 8px 10px -6px rgb(0 0 0 / 0.05);
        }

        [data-bs-theme="dark"] {
            --bg-body: #020617;
            --bg-surface: #0f172a;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: #1e293b;
            --shadow-lg: 0 20px 25px -5px rgb(0 0 0 / 0.5), 0 8px 10px -6px rgb(0 0 0 / 0.5);
        }

        /* ============================================
           2. GLOBAL & BACKGROUND
           ============================================ */
        body {
            background-color: var(--bg-body);
            color: var(--text-primary);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            /* Subtle enterprise mesh gradient */
            background-image: radial-gradient(at 0% 0%, rgba(37, 99, 235, 0.05) 0px, transparent 50%),
            radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.05) 0px, transparent 50%);
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        [data-bs-theme="dark"] body {
            background-image: radial-gradient(at 0% 0%, rgba(37, 99, 235, 0.15) 0px, transparent 50%),
            radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.15) 0px, transparent 50%);
        }

        /* ============================================
           3. LOGIN CARD
           ============================================ */
        .login-card {
            background-color: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 420px;
            padding: 2.5rem;
            transition: all 0.3s ease;
        }

        /* ============================================
           4. FORM CONTROLS & INPUTS
           ============================================ */
        .form-label {
            color: var(--text-primary);
            font-weight: 500;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
        }

        .form-control {
            background-color: var(--bg-body);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 0.95rem;
            transition: all 0.2s;
        }

        .form-control::placeholder {
            color: var(--text-secondary);
            opacity: 0.7;
        }

        .form-control:focus {
            background-color: var(--bg-surface);
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
            color: var(--text-primary);
        }

        /* Input Icons */
        .input-icon-wrapper {
            position: relative;
        }
        .input-icon-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            z-index: 1;
            transition: color 0.2s;
        }
        .input-icon-wrapper .form-control {
            padding-left: 42px;
        }
        .input-icon-wrapper:focus-within i {
            color: var(--accent-primary);
        }

        /* Password Toggle */
        .password-wrapper {
            position: relative;
        }
        .password-wrapper .form-control {
            padding-right: 42px;
        }
        .password-toggle {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 0;
            line-height: 1;
            z-index: 2;
        }
        .password-toggle:hover {
            color: var(--accent-primary);
        }

        /* ============================================
           5. BUTTONS & ALERTS
           ============================================ */
        .btn-primary {
            background-color: var(--accent-primary);
            border: none;
            padding: 0.75rem;
            font-weight: 600;
            border-radius: 8px;
            font-size: 0.95rem;
            transition: all 0.2s;
        }
        .btn-primary:hover {
            background-color: var(--accent-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.3);
        }
        .btn-primary:active {
            transform: translateY(0);
        }
        .btn-primary:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .alert {
            border-radius: 8px;
            border: none;
            font-size: 0.9rem;
            padding: 0.75rem 1rem;
            display: flex;
            align-items: center;
        }
        .alert-danger {
            background-color: rgba(239, 68, 68, 0.1);
            color: #ef4444;
        }
        .alert-success {
            background-color: rgba(34, 197, 94, 0.1);
            color: #22c55e;
        }
        [data-bs-theme="dark"] .alert-danger {
            background-color: rgba(239, 68, 68, 0.15);
            color: #f87171;
        }
        [data-bs-theme="dark"] .alert-success {
            background-color: rgba(34, 197, 94, 0.15);
            color: #4ade80;
        }

        /* ============================================
           6. UTILITIES & RESPONSIVE
           ============================================ */
        .theme-toggle {
            background-color: var(--bg-surface);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: var(--shadow-lg);
        }
        .theme-toggle:hover {
            color: var(--accent-primary);
            border-color: var(--accent-primary);
            transform: rotate(15deg);
        }

        .form-check-input:checked {
            background-color: var(--accent-primary);
            border-color: var(--accent-primary);
        }
        .form-check-label {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        /* Mobile: Full screen card */
        @media (max-width: 576px) {
            .login-card {
                border: none;
                border-radius: 0;
                box-shadow: none;
                max-width: 100%;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                justify-content: center;
                padding: 2rem;
            }
        }
    </style>
</head>

<body>

<!-- Theme Toggle (Floating Top Right) -->
<button class="theme-toggle position-fixed top-0 end-0 m-3 m-sm-4" onclick="toggleTheme()" aria-label="Toggle dark mode" id="themeToggleBtn">
    <i class="bi bi-moon-stars-fill"></i>
</button>

<div class="login-card">
    <!-- Brand Header -->
    <div class="text-center mb-4">
        <div class="d-inline-flex align-items-center justify-content-center rounded-circle mb-3"
             style="width: 64px; height: 64px; background-color: rgba(37, 99, 235, 0.1);">
            <i class="bi bi-ticket-perforated-fill text-primary" style="font-size: 1.8rem;"></i>
        </div>
        <h2 class="fw-bold mb-1">Welcome back</h2>
        <p class="text-secondary mb-0">Sign in to your IT Support account</p>
    </div>

    <!-- Alerts -->
    <div th:if="${param.error}" class="alert alert-danger mb-4" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <div>Invalid username or password.</div>
    </div>
    <div th:if="${param.logout}" class="alert alert-success mb-4" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <div>You have been successfully logged out.</div>
    </div>

    <!-- Login Form -->
    <form th:action="@{/login}" method="post" id="loginForm" novalidate>

        <!-- Username -->
        <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <div class="input-icon-wrapper">
                <i class="bi bi-person"></i>
                <input type="text" class="form-control" id="username" name="username"
                       placeholder="Enter your username" required autofocus autocomplete="username">
            </div>
        </div>

        <!-- Password -->
        <div class="mb-4">
            <label for="password" class="form-label">Password</label>
            <div class="password-wrapper input-icon-wrapper">
                <i class="bi bi-lock"></i>
                <input type="password" class="form-control" id="password" name="password"
                       placeholder="Enter your password" required autocomplete="current-password">
                <button type="button" class="password-toggle" onclick="togglePassword()" aria-label="Toggle password visibility">
                    <i class="bi bi-eye" id="passwordIcon"></i>
                </button>
            </div>
        </div>

        <!-- Remember Me -->
        <div class="mb-4 form-check">
            <input type="checkbox" class="form-check-input" id="remember-me" name="remember-me">
            <label class="form-check-label" for="remember-me">
                Remember me for 30 days
            </label>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn btn-primary w-100 d-flex align-items-center justify-content-center" id="submitBtn">
            <span id="btnText">Sign In</span>
            <span id="btnSpinner" class="d-none">
                    <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
                    Signing in...
                </span>
        </button>
    </form>

    <!-- Footer -->
    <div class="text-center mt-4 pt-4 border-top" style="border-color: var(--border-color) !important;">
        <small class="text-secondary">
            Need help? Contact <a href="mailto:support@company.com" class="text-decoration-none fw-medium" style="color: var(--accent-primary);">IT Support</a>
        </small>
    </div>
</div>

<!-- Scripts -->

<script>
    // ============================================
    // PASSWORD VISIBILITY TOGGLE
    // ============================================
    function togglePassword() {
        const pwd = document.getElementById('password');
        const icon = document.getElementById('passwordIcon');
        if (pwd.type === 'password') {
            pwd.type = 'text';
            icon.classList.replace('bi-eye', 'bi-eye-slash');
        } else {
            pwd.type = 'password';
            icon.classList.replace('bi-eye-slash', 'bi-eye');
        }
    }

    // ============================================
    // FORM LOADING STATE (Prevents double submissions)
    // ============================================
    document.getElementById('loginForm').addEventListener('submit', function() {
        const btn = document.getElementById('submitBtn');
        const text = document.getElementById('btnText');
        const spinner = document.getElementById('btnSpinner');

        btn.disabled = true;
        text.classList.add('d-none');
        spinner.classList.remove('d-none');
    });

    // ============================================
    // DARK MODE TOGGLE (Persisted in LocalStorage)
    // ============================================
    function toggleTheme() {
        const html = document.documentElement;
        const currentTheme = html.getAttribute('data-bs-theme');
        const newTheme = currentTheme === 'light' ? 'dark' : 'light';

        html.setAttribute('data-bs-theme', newTheme);
        localStorage.setItem('theme', newTheme);
        updateThemeIcon(newTheme);
    }

    function updateThemeIcon(theme) {
        const icon = document.querySelector('#themeToggleBtn i');
        if (icon) {
            icon.className = theme === 'dark' ? 'bi bi-sun-fill' : 'bi bi-moon-stars-fill';
        }
    }

    // Initialize theme on load
    (function() {
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-bs-theme', savedTheme);
        updateThemeIcon(savedTheme);
    })();
</script>
</body>
</html>
