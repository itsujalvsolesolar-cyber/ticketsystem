<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${pageTitle})}"></head>
<body>
<div th:replace="~{fragments/layout :: sidebar}"></div>

<main class="main-content">
    <div class="page-header mb-4">
        <h1 class="h3 fw-bold mb-1">Audit Log Viewer</h1>
        <p class="text-secondary mb-0">Immutable record of all system activities and changes</p>
    </div>

    <!-- Filter Form -->
    <div class="card border-0 shadow-sm mb-4">
        <div class="card-body">
            <form th:action="@{/audit/viewer}" method="get" class="row g-3">
                <div class="col-md-2">
                    <label class="form-label small fw-semibold">Module</label>
                    <select name="module" class="form-select form-select-sm">
                        <option value="">All Modules</option>
                        <option value="TICKETING" th:selected="${module == 'TICKETING'}">Ticketing</option>
                        <option value="USER" th:selected="${module == 'USER'}">User Management</option>
                        <option value="ASSET" th:selected="${module == 'ASSET'}">Assets</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label small fw-semibold">Action</label>
                    <select name="action" class="form-select form-select-sm">
                        <option value="">All Actions</option>
                        <option th:each="a : ${T(com.sujal.itsm.core.audit.enums.AuditAction).values()}"
                                th:value="${a}" th:text="${a}" th:selected="${action == a}"></option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label small fw-semibold">Performed By</label>
                    <input type="text" name="performedBy" class="form-control form-control-sm" th:value="${performedBy}" placeholder="Username">
                </div>
                <div class="col-md-2">
                    <label class="form-label small fw-semibold">Start Date</label>
                    <input type="date" name="startDate" class="form-control form-control-sm" th:value="${startDate}">
                </div>
                <div class="col-md-2">
                    <label class="form-label small fw-semibold">End Date</label>
                    <input type="date" name="endDate" class="form-control form-control-sm" th:value="${endDate}">
                </div>
                <div class="col-md-2 d-flex align-items-end">
                    <button type="submit" class="btn btn-primary btn-sm w-100"><i class="bi bi-search me-1"></i> Filter</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Audit Table -->
    <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="bg-light">
                    <tr>
                        <th class="ps-4">Timestamp</th>
                        <th>Module</th>
                        <th>Action</th>
                        <th>Performed By</th>
                        <th>IP Address</th>
                        <th>Details</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="log : ${logs.content}">
                        <td class="ps-4 text-nowrap" th:text="${#temporals.format(log.timestamp, 'dd MMM yyyy, HH:mm:ss')}">Date</td>
                        <td><span class="badge bg-secondary-subtle text-secondary-emphasis" th:text="${log.module}">MODULE</span></td>
                        <td>
                            <span th:classappend="${log.action.name() == 'DELETE' ? 'badge bg-danger' : (log.action.name() == 'CREATE' ? 'badge bg-success' : 'badge bg-info')}"
                                  th:text="${log.action}">ACTION</span>
                        </td>
                        <td>
                            <div class="fw-semibold" th:text="${log.performedBy}">User</div>
                            <small class="text-muted" th:text="${log.userRole}">Role</small>
                        </td>
                        <td class="text-muted small" th:text="${log.ipAddress}">192.168.1.1</td>
                        <td>
                            <small class="text-muted d-block" th:text="${log.entityType} + ' ID: ' + ${log.recordId}">Entity</small>
                            <small class="text-muted" th:if="${log.remarks}" th:text="'Note: ' + ${log.remarks}"></small>
                        </td>
                    </tr>
                    <tr th:if="${logs.empty}">
                        <td colspan="6" class="text-center py-5 text-secondary">
                            <i class="bi bi-shield-check fs-1 d-block mb-2"></i>
                            No audit logs found matching your criteria.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <!-- Pagination -->
        <div class="card-footer bg-white d-flex justify-content-between align-items-center" th:if="${logs.totalPages > 1}">
            <small class="text-muted">Showing page <span th:text="${currentPage + 1}"></span> of <span th:text="${logs.totalPages}"></span></small>
            <div>
                <a th:if="${currentPage > 0}" th:href="@{/audit/viewer(page=${currentPage - 1}, module=${module}, action=${action}, performedBy=${performedBy}, startDate=${startDate}, endDate=${endDate})}" class="btn btn-sm btn-outline-secondary">Previous</a>
                <a th:if="${currentPage < logs.totalPages - 1}" th:href="@{/audit/viewer(page=${currentPage + 1}, module=${module}, action=${action}, performedBy=${performedBy}, startDate=${startDate}, endDate=${endDate})}" class="btn btn-sm btn-outline-secondary">Next</a>
            </div>
        </div>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
