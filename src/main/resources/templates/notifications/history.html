<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${pageTitle})}"></head>
<body>
<div th:replace="~{fragments/layout :: sidebar}"></div>

<main class="main-content">
    <div class="page-header mb-4">
        <h1 class="h3 fw-bold mb-1">Notification History</h1>
        <p class="text-secondary mb-0">View all your past alerts and system messages</p>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
            <div th:if="${#lists.isEmpty(notifications)}" class="text-center py-5">
                <i class="bi bi-bell-slash fs-1 text-secondary d-block mb-3"></i>
                <h5 class="fw-bold mb-2">No notifications yet</h5>
                <p class="text-secondary">You're all caught up!</p>
            </div>

            <div th:unless="${#lists.isEmpty(notifications)}" class="list-group list-group-flush">
                <div th:each="notif : ${notifications}"
                     class="list-group-item list-group-item-action p-3"
                     th:classappend="${!notif.isRead} ? 'bg-light' : ''">

                    <div class="d-flex w-100 justify-content-between align-items-start">
                        <div class="d-flex align-items-start gap-3">
                            <!-- Priority Icon -->
                            <div th:switch="${notif.priority.name()}">
                                <i th:case="'CRITICAL'" class="bi bi-exclamation-octagon-fill text-danger fs-4"></i>
                                <i th:case="'HIGH'" class="bi bi-exclamation-triangle-fill text-warning fs-4"></i>
                                <i th:case="'MEDIUM'" class="bi bi-info-circle-fill text-info fs-4"></i>
                                <i th:case="'LOW'" class="bi bi-chat-left-text-fill text-secondary fs-4"></i>
                                <i th:case="*" class="bi bi-bell-fill text-primary fs-4"></i>
                            </div>

                            <div>
                                <h6 class="mb-1 fw-bold" th:text="${notif.title}">Notification Title</h6>
                                <p class="mb-1 text-secondary" th:text="${notif.message}">Notification message goes here.</p>
                                <small class="text-muted">
                                    <span th:text="${#temporals.format(notif.createdAt, 'dd MMM yyyy, HH:mm')}">Date</span>
                                    <span class="badge bg-secondary-subtle text-secondary-emphasis ms-2" th:text="${notif.module}">MODULE</span>
                                    <span th:if="${!notif.isRead}" class="badge bg-primary-subtle text-primary-emphasis ms-1">Unread</span>
                                </small>
                            </div>
                        </div>

                        <!-- Action Button -->
                        <div>
                            <a th:if="${notif.module == 'TICKETING' and notif.referenceId != null}"
                               th:href="@{/tickets/{id}(id=${notif.referenceId})}"
                               class="btn btn-sm btn-outline-primary">
                                View Ticket
                            </a>
                            <a th:if="${notif.module == 'ITAMS' and notif.referenceId != null}"
                               th:href="@{/itams/assets/{id}(id=${notif.referenceId})}"
                               class="btn btn-sm btn-outline-primary">
                                View Asset
                            </a>
                            <form th:if="${!notif.isRead}" th:action="@{/api/notifications/{id}/read(id=${notif.id})}" method="post" class="d-inline" style="display: none;">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
