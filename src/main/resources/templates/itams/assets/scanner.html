<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('QR Scanner')}"></head>
<body>
<div th:replace="~{fragments/layout :: sidebar}"></div>

<main class="main-content">
    <div class="page-header mb-4">
        <h1 class="h3 fw-bold mb-1">Asset QR Scanner</h1>
        <p class="text-secondary mb-0">Point your camera at an asset QR code or use a USB barcode scanner</p>
    </div>

    <div class="row g-4">
        <!-- Camera Scanner -->
        <div class="col-md-8">
            <div class="card border-0 shadow-sm">
                <div class="card-body text-center">
                    <div id="reader" class="mx-auto" style="width: 100%; max-width: 500px;"></div>
                    <p class="text-muted mt-3 small">
                        <i class="bi bi-info-circle me-1"></i>
                        Allow camera access when prompted. Ensure good lighting for best results.
                    </p>
                    <button id="startScanBtn" class="btn btn-primary mt-2"><i class="bi bi-camera me-2"></i>Start Camera Scanner</button>
                    <button id="stopScanBtn" class="btn btn-outline-danger mt-2 d-none"><i class="bi bi-camera-video-off me-2"></i>Stop Scanner</button>
                </div>
            </div>
        </div>

        <!-- Manual / USB Scanner Input -->
        <div class="col-md-4">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-white fw-semibold">Manual / USB Scanner Input</div>
                <div class="card-body">
                    <form th:action="@{/itams/assets/scan}" method="get">
                        <div class="mb-3">
                            <label class="form-label">Asset ID / QR Data</label>
                            <input type="text" name="assetId" id="manualScanInput" class="form-control form-control-lg"
                                   placeholder="Scan or type ID..." autofocus required>
                            <div class="form-text">USB scanners act as keyboards and auto-submit.</div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="bi bi-search me-2"></i>Lookup Asset
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<!-- Include HTML5-QRCode Library (Using cdnjs for stability) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    let html5QrcodeScanner;

    document.getElementById('startScanBtn').addEventListener('click', async function() {
        this.classList.add('d-none');
        document.getElementById('stopScanBtn').classList.remove('d-none');

        html5QrcodeScanner = new Html5Qrcode("reader");
        const config = { fps: 10, qrbox: { width: 250, height: 250 } };

        try {
            // Try to start with the rear camera first
            await html5QrcodeScanner.start({ facingMode: "environment" }, config, onScanSuccess, onScanFailure);
        } catch (err) {
            console.warn("Rear camera not found, trying any available camera...", err);
            try {
                // Fallback to any available camera
                await html5QrcodeScanner.start({ facingMode: "user" }, config, onScanSuccess, onScanFailure);
            } catch (fallbackErr) {
                alert("Camera access denied or not available. Please ensure you are using HTTPS or localhost, and have granted camera permissions.");
                this.classList.remove('d-none');
                document.getElementById('stopScanBtn').classList.add('d-none');
            }
        }
    });

    document.getElementById('stopScanBtn').addEventListener('click', function() {
        if (html5QrcodeScanner) {
            html5QrcodeScanner.stop().then(() => {
                this.classList.add('d-none');
                document.getElementById('startScanBtn').classList.remove('d-none');
                document.getElementById('reader').innerHTML = "";
            }).catch(err => console.error("Error stopping scanner", err));
        }
    });

    function onScanSuccess(decodedText, decodedResult) {
        html5QrcodeScanner.stop().then(() => {
            document.getElementById('stopScanBtn').classList.add('d-none');
            document.getElementById('startScanBtn').classList.remove('d-none');
            document.getElementById('reader').innerHTML = "";
            window.location.href = '/itams/assets/scan?assetId=' + encodeURIComponent(decodedText);
        });
    }

    function onScanFailure(error) {
        // Silently ignore scan failures
    }

    document.getElementById('manualScanInput').focus();
</script>
</body>
</html>
