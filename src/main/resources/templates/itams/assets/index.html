<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Assets')}"></head>
<body>
<div th:replace="~{fragments/layout :: sidebar}"></div>

<main class="main-content">
    <div class="page-header mb-4">
        <div class="d-flex justify-content-between align-items-center">
            <div>
                <h1 class="h3 fw-bold mb-1">IT Assets</h1>
                <p class="text-secondary mb-0">Manage all IT assets with QR code tracking</p>
            </div>
            <a href="/itams/assets/new" class="btn btn-primary">
                <i class="bi bi-plus-circle me-2"></i>New Asset
            </a>
        </div>
    </div>

    <!-- Alerts -->
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
        <i class="bi bi-check-circle me-2"></i><span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Statistics Cards -->
    <div class="row g-3 mb-4">
        <div class="col-md-4">
            <div class="card border-0 shadow-sm">
                <div class="card-body">
                    <div class="d-flex align-items-center">
                        <div class="analytics-icon bg-primary-subtle text-primary me-3">
                            <i class="bi bi-box-seam"></i>
                        </div>
                        <div>
                            <h3 class="fw-bold mb-0" th:text="${totalAssets}">0</h3>
                            <p class="text-secondary small mb-0">Total Assets</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card border-0 shadow-sm">
                <div class="card-body">
                    <div class="d-flex align-items-center">
                        <div class="analytics-icon bg-success-subtle text-success me-3">
                            <i class="bi bi-check-circle"></i>
                        </div>
                        <div>
                            <h3 class="fw-bold mb-0" th:text="${availableAssets}">0</h3>
                            <p class="text-secondary small mb-0">Available</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card border-0 shadow-sm">
                <div class="card-body">
                    <div class="d-flex align-items-center">
                        <div class="analytics-icon bg-warning-subtle text-warning me-3">
                            <i class="bi bi-person-check"></i>
                        </div>
                        <div>
                            <h3 class="fw-bold mb-0" th:text="${assignedAssets}">0</h3>
                            <p class="text-secondary small mb-0">Assigned</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Assets Table -->
    <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                    <tr>
                        <th class="ps-4">Asset Tag</th>
                        <th>Name</th>
                        <th>Category</th>
                        <th>Brand</th>
                        <th>Serial Number</th>
                        <th>Status</th>
                        <th>Condition</th>
                        <th>Warranty</th>
                        <th class="text-end pe-4">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="asset : ${assets}">
                        <td class="ps-4">
                            <span class="badge bg-primary-subtle text-primary-emphasis" th:text="${asset.assetTag}"></span>
                        </td>
                        <td>
                            <a th:href="@{/itams/assets/{id}(id=${asset.id})}" class="text-decoration-none fw-semibold" th:text="${asset.name}"></a>
                        </td>
                        <td th:text="${asset.category.name}"></td>
                        <td th:text="${asset.brand != null ? asset.brand.name : '-'}"></td>
                        <td>
                            <code th:text="${asset.serialNumber != null ? asset.serialNumber : '-'}"></code>
                        </td>
                        <td>
                            <span class="badge"
                                  th:classappend="${asset.status.name() == 'AVAILABLE'} ? 'bg-success-subtle text-success-emphasis' :
                                                  (${asset.status.name() == 'ASSIGNED'} ? 'bg-warning-subtle text-warning-emphasis' :
                                                  (${asset.status.name() == 'IN_REPAIR'} ? 'bg-info-subtle text-info-emphasis' :
                                                  'bg-secondary-subtle text-secondary-emphasis'))"
                                  th:text="${asset.status.displayName}"></span>
                        </td>
                        <td th:text="${asset.condition.displayName}"></td>
                        <td>
                            <span th:if="${asset.warrantyValid()}" class="badge bg-success-subtle text-success-emphasis">
                                <i class="bi bi-check-circle"></i> Valid
                            </span>
                            <span th:unless="${asset.warrantyValid()}" class="badge bg-danger-subtle text-danger-emphasis">
                                <i class="bi bi-x-circle"></i> Expired
                            </span>
                        </td>
                        <td class="text-end pe-4">
                            <div class="btn-group btn-group-sm">
                                <a th:href="@{/itams/assets/{id}(id=${asset.id})}" class="btn btn-outline-secondary btn-icon" title="View">
                                    <i class="bi bi-eye"></i>
                                </a>
                                <a th:href="@{/itams/assets/{id}/edit(id=${asset.id})}" class="btn btn-outline-primary btn-icon" title="Edit">
                                    <i class="bi bi-pencil"></i>
                                </a>
                                <a th:href="@{/itams/assets/{id}/qrcode(id=${asset.id})}" class="btn btn-outline-success btn-icon" title="Download QR">
                                    <i class="bi bi-qr-code"></i>
                                </a>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Pagination -->
        <div class="card-footer bg-transparent border-top py-3 px-4" th:if="${totalPages > 1}">
            <nav>
                <ul class="pagination pagination-sm mb-0 justify-content-center">
                    <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                        <a class="page-link" th:href="@{/itams/assets(page=${currentPage - 1})}">Previous</a>
                    </li>
                    <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                        th:classappend="${i == currentPage} ? 'active'">
                        <a class="page-link" th:href="@{/itams/assets(page=${i})}" th:text="${i + 1}"></a>
                    </li>
                    <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                        <a class="page-link" th:href="@{/itams/assets(page=${currentPage + 1})}">Next</a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
