<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${pageTitle})}"></head>
<body>
<div th:replace="~{fragments/layout :: sidebar}"></div>

<main class="main-content">
    <div class="page-header mb-4">
        <nav aria-label="breadcrumb" class="mb-3">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/procurement/requests">Purchase Requests</a></li>
                <li class="breadcrumb-item active">New Request</li>
            </ol>
        </nav>
        <h1 class="h3 fw-bold mb-1">New Purchase Request</h1>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body p-4">
            <form th:action="@{/procurement/requests/create}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <div class="row g-3">
                    <div class="col-md-8">
                        <label class="form-label fw-semibold">Item / Service Title <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" name="title" required placeholder="e.g., Dell Latitude 5520 Laptop">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Estimated Cost (USD) <span class="text-danger">*</span></label>
                        <input type="number" step="0.01" class="form-control" name="estimatedCost" required placeholder="0.00">
                    </div>
                    <div class="col-12">
                        <label class="form-label fw-semibold">Business Justification <span class="text-danger">*</span></label>
                        <textarea class="form-control" name="justification" rows="3" required placeholder="Why is this purchase necessary?"></textarea>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Preferred Vendor (Optional)</label>
                        <input type="text" class="form-control" name="preferredVendor" placeholder="e.g., CDW, Amazon Business">
                    </div>
                </div>

                <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                    <a href="/procurement/requests" class="btn btn-outline-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-send me-2"></i>Submit for Approval
                    </button>
                </div>
            </form>
        </div>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
