<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${pageTitle})}"></head>
<body>
<div th:replace="~{fragments/layout :: sidebar}"></div>

<main class="main-content">
    <div class="page-header mb-4">
        <div class="d-flex justify-content-between align-items-center">
            <div>
                <h1 class="h3 fw-bold mb-1">Purchase Requests</h1>
                <p class="text-secondary mb-0">Manage and track procurement approvals</p>
            </div>
            <a href="/procurement/requests/new" class="btn btn-primary">
                <i class="bi bi-plus-circle me-2"></i>New Request
            </a>
        </div>
    </div>

    <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
        <i class="bi bi-check-circle me-2"></i><span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Pending Requests -->
    <div class="card border-0 shadow-sm mb-4" th:if="${#lists.isEmpty(pendingRequests) == false}">
        <div class="card-header bg-white py-3">
            <h5 class="mb-0 fw-semibold text-warning"><i class="bi bi-hourglass-split me-2"></i>Pending Approvals</h5>
        </div>
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="bg-light">
                <tr>
                    <th class="ps-4">Title</th>
                    <th>Requester</th>
                    <th>Estimated Cost</th>
                    <th>Status</th>
                    <th class="text-end pe-4">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="pr : ${pendingRequests}">
                    <td class="ps-4 fw-semibold" th:text="${pr.title}">Title</td>
                    <td th:text="${pr.requester.fullName ?: pr.requester.username}">User</td>
                    <td th:text="'$' + ${pr.estimatedCost}">$0.00</td>
                    <td><span class="badge bg-warning-subtle text-warning-emphasis">Pending</span></td>
                    <td class="text-end pe-4">
                        <a th:href="@{/procurement/requests/{id}(id=${pr.id})}" class="btn btn-sm btn-outline-primary">
                            <i class="bi bi-eye me-1"></i> View Details
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- My Requests -->
    <div class="card border-0 shadow-sm">
        <div class="card-header bg-white py-3">
            <h5 class="mb-0 fw-semibold">My Requests</h5>
        </div>
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="bg-light">
                <tr>
                    <th class="ps-4">Title</th>
                    <th>Estimated Cost</th>
                    <th>Created</th>
                    <th>Status</th>
                    <th class="text-end pe-4">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="pr : ${myRequests}">
                    <td class="ps-4 fw-semibold" th:text="${pr.title}">Title</td>
                    <td th:text="'$' + ${pr.estimatedCost}">$0.00</td>
                    <td th:text="${#temporals.format(pr.createdAt, 'dd MMM yyyy')}">Date</td>
                    <td>
                        <span th:if="${pr.status.name() == 'PENDING_APPROVAL'}" class="badge bg-warning-subtle text-warning-emphasis">Pending</span>
                        <span th:if="${pr.status.name() == 'APPROVED'}" class="badge bg-success-subtle text-success-emphasis">Approved</span>
                        <span th:if="${pr.status.name() == 'REJECTED'}" class="badge bg-danger-subtle text-danger-emphasis">Rejected</span>
                    </td>
                    <td class="text-end pe-4">
                        <a th:href="@{/procurement/requests/{id}(id=${pr.id})}" class="btn btn-sm btn-outline-primary">
                            <i class="bi bi-eye me-1"></i> View
                        </a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(myRequests)}">
                    <td colspan="5" class="text-center py-4 text-secondary">No requests found.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
