<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Suppliers')}"></head>
<body>
<div th:replace="~{fragments/layout :: sidebar}"></div>

<main class="main-content">
    <div class="page-header mb-4">
        <div class="d-flex justify-content-between align-items-center">
            <div>
                <h1 class="h3 fw-bold mb-1">Suppliers</h1>
                <p class="text-secondary mb-0">Manage IT asset suppliers and vendors</p>
            </div>
            <a href="/itams/suppliers/new" class="btn btn-primary">
                <i class="bi bi-plus-circle me-2"></i>New Supplier
            </a>
        </div>
    </div>

    <!-- Alerts -->
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
        <i class="bi bi-check-circle me-2"></i><span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
        <i class="bi bi-exclamation-triangle me-2"></i><span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Statistics -->
    <div class="row g-3 mb-4">
        <div class="col-md-6">
            <div class="card border-0 shadow-sm">
                <div class="card-body">
                    <div class="d-flex align-items-center">
                        <div class="analytics-icon bg-primary-subtle text-primary me-3">
                            <i class="bi bi-truck"></i>
                        </div>
                        <div>
                            <h3 class="fw-bold mb-0" th:text="${totalSuppliers}">0</h3>
                            <p class="text-secondary small mb-0">Total Suppliers</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card border-0 shadow-sm">
                <div class="card-body">
                    <div class="d-flex align-items-center">
                        <div class="analytics-icon bg-success-subtle text-success me-3">
                            <i class="bi bi-check-circle"></i>
                        </div>
                        <div>
                            <h3 class="fw-bold mb-0" th:text="${activeSuppliers}">0</h3>
                            <p class="text-secondary small mb-0">Active Suppliers</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Suppliers Table -->
    <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                    <tr>
                        <th class="ps-4">Name</th>
                        <th>Contact Person</th>
                        <th>Phone</th>
                        <th>Email</th>
                        <th>GST Number</th>
                        <th>Status</th>
                        <th class="text-end pe-4">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="supplier : ${suppliers}">
                        <td class="ps-4">
                            <div class="fw-semibold" th:text="${supplier.name}"></div>
                            <div class="text-secondary small" th:text="${supplier.address}"></div>
                        </td>
                        <td th:text="${supplier.contactPerson != null ? supplier.contactPerson : '-'}"></td>
                        <td>
                            <a th:if="${supplier.phone != null}" th:href="'tel:' + ${supplier.phone}"
                               class="text-decoration-none" th:text="${supplier.phone}"></a>
                        </td>
                        <td>
                            <a th:if="${supplier.email != null}" th:href="'mailto:' + ${supplier.email}"
                               class="text-decoration-none" th:text="${supplier.email}"></a>
                        </td>
                        <td>
                            <code th:if="${supplier.gstNumber != null}" th:text="${supplier.gstNumber}"></code>
                        </td>
                        <td>
                            <span th:if="${supplier.isActive}" class="badge bg-success-subtle text-success-emphasis">
                                <i class="bi bi-check-circle"></i> Active
                            </span>
                            <span th:unless="${supplier.isActive}" class="badge bg-secondary-subtle text-secondary-emphasis">
                                <i class="bi bi-x-circle"></i> Inactive
                            </span>
                        </td>
                        <td class="text-end pe-4">
                            <div class="btn-group btn-group-sm">
                                <a th:href="@{/itams/suppliers/{id}/edit(id=${supplier.id})}"
                                   class="btn btn-outline-primary btn-icon" title="Edit">
                                    <i class="bi bi-pencil"></i>
                                </a>
                                <form th:action="@{/itams/suppliers/{id}/delete(id=${supplier.id})}"
                                      method="post" class="d-inline"
                                      onsubmit="return confirm('Are you sure you want to deactivate this supplier?')">
                                    <button type="submit" class="btn btn-outline-danger btn-icon" title="Deactivate">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
