<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supplier Form - ITAMS</title>
    <head th:replace="~{fragments/layout :: head(${pageTitle})}"></head>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<div th:replace="~{fragments/layout :: sidebar}"></div>

<main class="main-content">
    <div class="page-header mb-4">
        <nav aria-label="breadcrumb" class="mb-2">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/itams/suppliers">Suppliers</a></li>
                <li class="breadcrumb-item active" th:text="${supplier.id != null ? 'Edit' : 'New'}"></li>
            </ol>
        </nav>
        <h1 class="h3 fw-bold" th:text="${supplier.id != null ? 'Edit Supplier' : 'Create New Supplier'}"></h1>
    </div>

    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
        <i class="bi bi-exclamation-triangle me-2"></i><span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body p-4">
            <form th:action="${supplier.id != null ? '/itams/suppliers/' + supplier.id : '/itams/suppliers'}"
                  th:object="${supplier}" method="post">

                <div class="row g-3">
                    <!-- Supplier Name -->
                    <div class="col-md-6">
                        <label for="name" class="form-label fw-semibold">
                            Supplier Name <span class="text-danger">*</span>
                        </label>
                        <input type="text" class="form-control" id="name" th:field="*{name}"
                               th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"
                               placeholder="e.g., Dell Technologies, HP Inc." required>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                    </div>

                    <!-- Contact Person -->
                    <div class="col-md-6">
                        <label for="contactPerson" class="form-label fw-semibold">Contact Person</label>
                        <input type="text" class="form-control" id="contactPerson" th:field="*{contactPerson}"
                               placeholder="Primary contact person name">
                    </div>

                    <!-- Phone -->
                    <div class="col-md-6">
                        <label for="phone" class="form-label fw-semibold">Phone Number</label>
                        <input type="tel" class="form-control" id="phone" th:field="*{phone}"
                               placeholder="+91 98765 43210">
                    </div>

                    <!-- Email -->
                    <div class="col-md-6">
                        <label for="email" class="form-label fw-semibold">Email Address</label>
                        <input type="email" class="form-control" id="email" th:field="*{email}"
                               th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                               placeholder="contact@supplier.com">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                    </div>

                    <!-- GST Number -->
                    <div class="col-md-6">
                        <label for="gstNumber" class="form-label fw-semibold">GST Number</label>
                        <input type="text" class="form-control" id="gstNumber" th:field="*{gstNumber}"
                               th:classappend="${#fields.hasErrors('gstNumber')} ? 'is-invalid'"
                               placeholder="22AAAAA0000A1Z5">
                        <div class="form-text">GSTIN format: 22AAAAA0000A1Z5</div>
                    </div>

                    <!-- Address -->
                    <div class="col-12">
                        <label for="address" class="form-label fw-semibold">Address</label>
                        <textarea class="form-control" id="address" th:field="*{address}"
                                  rows="3" placeholder="Complete address with city, state, and PIN code"></textarea>
                    </div>

                    <!-- Notes -->
                    <div class="col-12">
                        <label for="notes" class="form-label fw-semibold">Notes</label>
                        <textarea class="form-control" id="notes" th:field="*{notes}"
                                  rows="3" placeholder="Additional information about the supplier"></textarea>
                    </div>

                    <!-- Active Status -->
                    <div class="col-md-6">
                        <label class="form-label fw-semibold d-block">Status</label>
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" id="isActive"
                                   th:field="*{isActive}">
                            <label class="form-check-label" for="isActive">Active</label>
                        </div>
                        <div class="form-text">Inactive suppliers won't appear in dropdowns</div>
                    </div>
                </div>

                <div class="mt-4 d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-circle me-2"></i>
                        <span th:text="${supplier.id != null ? 'Update' : 'Create'}"></span>
                    </button>
                    <a href="/itams/suppliers" class="btn btn-outline-secondary">
                        <i class="bi bi-x-circle me-2"></i>Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
