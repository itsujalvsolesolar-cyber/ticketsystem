<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${pageTitle})}"></head>
<body>
<div th:replace="~{fragments/layout :: sidebar}"></div>

<main class="main-content">
    <div class="page-header mb-4">
        <div class="d-flex justify-content-between align-items-center">
            <div>
                <h1 class="h3 fw-bold mb-1">Software Catalog</h1>
                <p class="text-secondary mb-0">Manage master software inventory and licenses</p>
            </div>
            <a href="/itams/software-catalog/new" class="btn btn-primary">
                <i class="bi bi-plus-circle me-2"></i>Add Software
            </a>
        </div>
    </div>

    <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
        <i class="bi bi-check-circle me-2"></i><span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                    <tr>
                        <th class="ps-4">Software Name</th>
                        <th>Vendor</th>
                        <th>Total Seats</th>
                        <th>Cost / Seat</th>
                        <th class="text-end pe-4">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="cat : ${catalogs}">
                        <td class="ps-4 fw-semibold" th:text="${cat.name}"></td>
                        <td th:text="${cat.vendor ?: '-'}"></td>
                        <td>
                            <span class="badge bg-light text-dark border" th:text="${cat.totalSeats}"></span>
                        </td>
                        <td th:text="${cat.costPerSeat != null ? '₹ ' + cat.costPerSeat : '-'}"></td>
                        <td class="text-end pe-4">
                            <div class="btn-group btn-group-sm">
                                <a th:href="@{/itams/software-catalog/{id}/edit(id=${cat.id})}" class="btn btn-outline-primary btn-icon">
                                    <i class="bi bi-pencil"></i>
                                </a>
                                <form th:action="@{/itams/software-catalog/{id}/delete(id=${cat.id})}" method="post" class="d-inline"
                                      onsubmit="return confirm('Remove this software from the catalog?')">
                                    <button type="submit" class="btn btn-outline-danger btn-icon">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(catalogs)}">
                        <td colspan="5" class="text-center py-4 text-secondary">
                            <i class="bi bi-inbox fs-4 d-block mb-2"></i>
                            No software in catalog. Click "Add Software" to begin.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
