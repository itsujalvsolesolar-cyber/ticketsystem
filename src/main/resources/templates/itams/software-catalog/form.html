<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${pageTitle})}"></head>
<body>
<div th:replace="~{fragments/layout :: sidebar}"></div>

<main class="main-content">
    <div class="page-header mb-4">
        <nav aria-label="breadcrumb" class="mb-2">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/itams/software-catalog">Software Catalog</a></li>
                <li class="breadcrumb-item active" th:text="${catalog.id != null ? 'Edit' : 'Add'}"></li>
            </ol>
        </nav>
        <h1 class="h3 fw-bold" th:text="${pageTitle}"></h1>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body p-4">
            <form th:action="${catalog.id != null ? '/itams/software-catalog/' + catalog.id : '/itams/software-catalog'}"
                  th:object="${catalog}" method="post">
                
                <!-- CSRF Token -->
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="name" class="form-label fw-semibold">Software Name <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="name" th:field="*{name}" required 
                               placeholder="e.g., Microsoft Office 365, SAP, Adobe CC">
                    </div>

                    <div class="col-md-6">
                        <label for="vendor" class="form-label fw-semibold">Vendor</label>
                        <input type="text" class="form-control" id="vendor" th:field="*{vendor}" 
                               placeholder="e.g., Microsoft, Adobe, SAP">
                    </div>

                    <div class="col-md-4">
                        <label for="totalSeats" class="form-label fw-semibold">Total Seats (Licenses)</label>
                        <input type="number" class="form-control" id="totalSeats" th:field="*{totalSeats}" min="0" placeholder="0">
                    </div>

                    <div class="col-md-4">
                        <label for="costPerSeat" class="form-label fw-semibold">Cost Per Seat ()</label>
                        <input type="number" class="form-control" id="costPerSeat" th:field="*{costPerSeat}" step="0.01" min="0">
                    </div>

                    <div class="col-md-4">
                        <label class="form-label fw-semibold d-block">Status</label>
                        <div class="form-check form-switch mt-2">
                            <input class="form-check-input" type="checkbox" id="isActive" th:field="*{isActive}">
                            <label class="form-check-label" for="isActive">Active in Catalog</label>
                        </div>
                    </div>

                    <div class="col-12">
                        <label for="description" class="form-label fw-semibold">Description / Notes</label>
                        <textarea class="form-control" id="description" th:field="*{description}" rows="3"></textarea>
                    </div>
                </div>

                <div class="mt-4 d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-circle me-2"></i><span th:text="${catalog.id != null ? 'Update' : 'Add'}"></span>
                    </button>
                    <a href="/itams/software-catalog" class="btn btn-outline-secondary">
                        <i class="bi bi-x-circle me-2"></i>Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>
</main>
</body>
</html>
