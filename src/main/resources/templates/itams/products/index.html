<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${pageTitle})}"></head>
<body>
<div th:replace="~{fragments/layout :: sidebar}"></div>

<main class="main-content">
    <div class="page-header mb-4">
        <div class="d-flex justify-content-between align-items-center">
            <div>
                <h1 class="h3 fw-bold mb-1">Products</h1>
                <p class="text-secondary mb-0">Manage IT inventory items and stock levels</p>
            </div>
            <a href="/itams/products/new" class="btn btn-primary">
                <i class="bi bi-plus-circle me-2"></i>New Product
            </a>
        </div>
    </div>

    <!-- Alerts -->
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
        <i class="bi bi-check-circle me-2"></i><span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
        <i class="bi bi-exclamation-triangle me-2"></i><span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Products Table -->
    <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                    <tr>
                        <th class="ps-4">Product Name</th>
                        <th>SKU</th>
                        <th>Category</th>
                        <th>Brand</th>
                        <th>Stock</th>
                        <th>Unit Price</th>
                        <th class="text-end pe-4">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="product : ${products}">
                        <td class="ps-4">
                            <div class="fw-semibold" th:text="${product.name}"></div>
                            <div class="text-secondary small" th:text="${product.modelNumber}"></div>
                        </td>
                        <td>
                            <span class="badge bg-light text-dark border" th:text="${product.sku ?: '-'}"></span>
                        </td>
                        <td th:text="${product.category != null ? product.category.name : '-'}"></td>
                        <td th:text="${product.brand != null ? product.brand.name : '-'}"></td>
                        <td>
                            <!-- Low Stock Warning Badge -->
                            <span th:if="${product.currentStock <= product.minStockLevel}"
                                  class="badge bg-danger-subtle text-danger-emphasis">
                                <i class="bi bi-exclamation-triangle"></i>
                                <span th:text="${product.currentStock}"></span> / <span th:text="${product.minStockLevel}"></span>
                            </span>
                            <span th:unless="${product.currentStock <= product.minStockLevel}"
                                  class="text-success fw-semibold"
                                  th:text="${product.currentStock} + ' ' + ${product.unit}">
                            </span>
                        </td>
                        <td th:text="${product.unitPrice != null ? '₹ ' + product.unitPrice : '-'}"></td>
                        <td class="text-end pe-4">
                            <div class="btn-group btn-group-sm">
                                <a th:href="@{/itams/products/{id}/edit(id=${product.id})}"
                                   class="btn btn-outline-primary btn-icon" data-bs-toggle="tooltip" title="Edit">
                                    <i class="bi bi-pencil"></i>
                                </a>
                                <form th:action="@{/itams/products/{id}/delete(id=${product.id})}"
                                      method="post" class="d-inline"
                                      onsubmit="return confirm('Are you sure you want to deactivate this product?')">
                                    <button type="submit" class="btn btn-outline-danger btn-icon" data-bs-toggle="tooltip" title="Deactivate">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(products)}">
                        <td colspan="7" class="text-center py-4 text-secondary">
                            <i class="bi bi-inbox fs-4 d-block mb-2"></i>
                            No products found. Click "New Product" to add one.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        var tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'));
        tooltipTriggerList.map(function (el) { return new bootstrap.Tooltip(el); });
    });
</script>
</body>
</html>
