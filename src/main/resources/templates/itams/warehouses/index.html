<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${pageTitle})}"></head>
<body>
<div th:replace="~{fragments/layout :: sidebar}"></div>

<main class="main-content">
    <div class="page-header mb-4">
        <div class="d-flex justify-content-between align-items-center">
            <div>
                <h1 class="h3 fw-bold mb-1">Warehouses</h1>
                <p class="text-secondary mb-0">Manage storage locations and stockrooms</p>
            </div>
            <a href="/itams/warehouses/new" class="btn btn-primary">
                <i class="bi bi-plus-circle me-2"></i>New Warehouse
            </a>
        </div>
    </div>

    <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
        <i class="bi bi-check-circle me-2"></i><span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                    <tr>
                        <th class="ps-4">Warehouse Name</th>
                        <th>Location</th>
                        <th>Manager</th>
                        <th>Capacity</th>
                        <th class="text-end pe-4">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="warehouse : ${warehouses}">
                        <td class="ps-4 fw-semibold" th:text="${warehouse.name}"></td>
                        <td th:text="${warehouse.location ?: '-'}"></td>
                        <td th:text="${warehouse.managerName ?: '-'}"></td>
                        <td>
                            <span class="badge bg-light text-dark border" th:text="${warehouse.capacity != null ? warehouse.capacity + ' units' : 'Unlimited'}"></span>
                        </td>
                        <td class="text-end pe-4">
                            <div class="btn-group btn-group-sm">
                                <a th:href="@{/itams/warehouses/{id}/edit(id=${warehouse.id})}"
                                   class="btn btn-outline-primary btn-icon" data-bs-toggle="tooltip" title="Edit">
                                    <i class="bi bi-pencil"></i>
                                </a>
                                <form th:action="@{/itams/warehouses/{id}/delete(id=${warehouse.id})}"
                                      method="post" class="d-inline"
                                      onsubmit="return confirm('Deactivate this warehouse?')">
                                    <button type="submit" class="btn btn-outline-danger btn-icon" data-bs-toggle="tooltip" title="Deactivate">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(warehouses)}">
                        <td colspan="5" class="text-center py-4 text-secondary">
                            <i class="bi bi-inbox fs-4 d-block mb-2"></i>
                            No warehouses found. Click "New Warehouse" to add one.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        var tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'));
        tooltipTriggerList.map(function (el) { return new bootstrap.Tooltip(el); });
    });
</script>
</body>
</html>
