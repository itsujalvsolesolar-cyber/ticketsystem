<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${pageTitle})}"></head>
<body>
<div th:replace="~{fragments/layout :: sidebar}"></div>
<main class="main-content">
    <div class="page-header mb-4 d-flex justify-content-between align-items-center">
        <h1 class="h3 fw-bold mb-0" th:text="${pageTitle}">Employees</h1>
        <a href="/itams/employees/new" class="btn btn-primary"><i class="bi bi-plus-circle me-2"></i>New Employee</a>
    </div>

    <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
        <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
            <tbody>
                <tr th:each="emp : ${employees}">
                    <!-- 1. Full Name (Uses the getFullName() helper method) -->
                    <td class="ps-4 fw-semibold" th:text="${emp.fullName}">John Doe</td>
                    
                    <!-- 2. Employee ID (Mapped to actual field: employeeCode) -->
                    <td><code class="badge bg-light text-dark border" th:text="${emp.employeeCode ?: '-'}">EMP-001</code></td>
                    
                    <!-- 3. CRITICAL FIX: Department Name (Prevents LazyInitializationException) -->
                    <td th:text="${emp.department != null ? emp.department.name : 'Unassigned'}">IT</td>
                    
                    <!-- 4. Designation (Mapped to actual field: jobTitle) -->
                    <td th:text="${emp.jobTitle ?: '-'}">Software Engineer</td>
                    
                    <!-- 5. Email -->
                    <td th:text="${emp.email ?: '-'}">john@company.com</td>
                    
                    <!-- 6. Actions -->
                    <td class="text-end pe-4">
                        <a th:href="@{/itams/employees/{id}/edit(id=${emp.id})}" class="btn btn-sm btn-outline-primary me-1">
                            <i class="bi bi-pencil-square"></i> Edit
                        </a>
                        <form th:action="@{/itams/employees/{id}/delete(id=${emp.id})}" method="post" class="d-inline" onsubmit="return confirm('Are you sure you want to deactivate this employee and revoke their IT access?');">
                            <!-- Thymeleaf's th:action automatically injects the CSRF token -->
                            <button type="submit" class="btn btn-sm btn-outline-danger">
                                <i class="bi bi-person-x"></i> Deactivate
                            </button>
                        </form>
                    </td>
                </tr>
                
                <!-- Empty State (If no employees exist) -->
                <tr th:if="${#lists.isEmpty(employees)}">
                    <td colspan="6" class="text-center py-5 text-muted">
                        <i class="bi bi-people fs-1 d-block mb-2"></i>
                        No active employees found. 
                        <a href="/itams/employees/new" class="text-primary fw-semibold">Onboard your first employee</a>.
                    </td>
                </tr>
            </tbody>
        </div>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
