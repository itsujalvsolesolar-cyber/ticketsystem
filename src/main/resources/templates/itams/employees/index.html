<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${pageTitle})}"></head>
<body>
<div th:replace="~{fragments/layout :: sidebar}"></div>
<main class="main-content">
    <div class="page-header mb-4 d-flex justify-content-between align-items-center">
        <h1 class="h3 fw-bold mb-0" th:text="${pageTitle}">Employees</h1>
        <a href="/itams/employees/new" class="btn btn-primary"><i class="bi bi-plus-circle me-2"></i>New Employee</a>
    </div>

    <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
        <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead>
                <tr>
                    <th class="ps-4">Name</th>
                    <th>Employee ID</th>
                    <th>Department</th>
                    <th>Designation</th>
                    <th>Email</th>
                    <th class="text-end pe-4">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="emp : ${employees}">
                    <td class="ps-4 fw-semibold" th:text="${emp.fullName}"></td>
                    <td th:text="${emp.employeeId ?: '-'}"></td>
                    <td th:text="${emp.department ?: '-'}"></td>
                    <td th:text="${emp.designation ?: '-'}"></td>
                    <td th:text="${emp.email ?: '-'}"></td>
                    <td class="text-end pe-4">
                        <a th:href="@{/itams/employees/{id}/edit(id=${emp.id})}" class="btn btn-sm btn-outline-primary">Edit</a>
                        <form th:action="@{/itams/employees/{id}/delete(id=${emp.id})}" method="post" class="d-inline" onsubmit="return confirm('Deactivate this employee?')">
                            <button type="submit" class="btn btn-sm btn-outline-danger">Deactivate</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
