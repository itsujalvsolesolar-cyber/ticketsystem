<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Brands')}"></head>
<body>
<div th:replace="~{fragments/layout :: sidebar}"></div>

<main class="main-content">
    <div class="page-header mb-4">
        <div class="d-flex justify-content-between align-items-center">
            <div>
                <h1 class="h3 fw-bold mb-1">Brands</h1>
                <p class="text-secondary mb-0">Manage IT asset manufacturers and brands</p>
            </div>
            <a href="/itams/brands/new" class="btn btn-primary">
                <i class="bi bi-plus-circle me-2"></i>New Brand
            </a>
        </div>
    </div>

    <!-- Success/Error Messages -->
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
        <i class="bi bi-check-circle me-2"></i>
        <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
        <i class="bi bi-exclamation-triangle me-2"></i>
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Statistics Cards -->
    <div class="row g-3 mb-4">
        <div class="col-md-6">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body">
                    <div class="d-flex align-items-center">
                        <div class="analytics-icon bg-primary-subtle text-primary me-3">
                            <i class="bi bi-bookmark-fill"></i>
                        </div>
                        <div>
                            <h3 class="fw-bold mb-0" th:text="${totalBrands}">0</h3>
                            <p class="text-secondary small mb-0">Total Brands</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body">
                    <div class="d-flex align-items-center">
                        <div class="analytics-icon bg-success-subtle text-success me-3">
                            <i class="bi bi-check-circle-fill"></i>
                        </div>
                        <div>
                            <h3 class="fw-bold mb-0" th:text="${activeBrands}">0</h3>
                            <p class="text-secondary small mb-0">Active Brands</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Brands Table -->
    <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                    <tr>
                        <th class="ps-4">Name</th>
                        <th>Website</th>
                        <th>Description</th>
                        <th>Status</th>
                        <th>Created</th>
                        <th class="text-end pe-4">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="brand : ${brands}">
                        <td class="ps-4">
                            <div class="fw-semibold" th:text="${brand.name}"></div>
                        </td>
                        <td>
                            <a th:if="${brand.website != null and !brand.website.isEmpty()}"
                               th:href="${brand.website}" target="_blank"
                               class="text-decoration-none text-primary small">
                                <i class="bi bi-link-45deg me-1"></i><span th:text="${brand.website}"></span>
                            </a>
                            <span th:unless="${brand.website != null and !brand.website.isEmpty()}" class="text-secondary small">-</span>
                        </td>
                        <td>
                            <div class="text-secondary small text-truncate" style="max-width: 250px;" th:text="${brand.description}"></div>
                        </td>
                        <td>
                            <span th:if="${brand.isActive}" class="badge bg-success-subtle text-success-emphasis">
                                <i class="bi bi-check-circle"></i> Active
                            </span>
                            <span th:unless="${brand.isActive}" class="badge bg-secondary-subtle text-secondary-emphasis">
                                <i class="bi bi-x-circle"></i> Inactive
                            </span>
                        </td>
                        <td>
                            <div class="small" th:text="${#temporals.format(brand.createdAt, 'dd MMM yyyy')}"></div>
                        </td>
                        <td class="text-end pe-4">
                            <div class="btn-group btn-group-sm">
                                <a th:href="@{/itams/brands/{id}/edit(id=${brand.id})}"
                                   class="btn btn-outline-primary btn-icon" data-bs-toggle="tooltip" title="Edit">
                                    <i class="bi bi-pencil"></i>
                                </a>
                                <form th:action="@{/itams/brands/{id}/delete(id=${brand.id})}"
                                      method="post" class="d-inline"
                                      onsubmit="return confirm('Are you sure you want to deactivate this brand?')">
                                    <button type="submit" class="btn btn-outline-danger btn-icon" data-bs-toggle="tooltip" title="Deactivate">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        var tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'));
        tooltipTriggerList.map(function (el) {
            return new bootstrap.Tooltip(el);
        });
    });
</script>
</body>
</html>
