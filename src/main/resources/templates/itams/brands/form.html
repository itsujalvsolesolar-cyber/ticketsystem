<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${pageTitle})}"></head>
<body>
<div th:replace="~{fragments/layout :: sidebar}"></div>

<main class="main-content">
    <div class="page-header mb-4">
        <nav aria-label="breadcrumb" class="mb-2">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/itams/brands">Brands</a></li>
                <li class="breadcrumb-item active" th:text="${brand.id != null ? 'Edit' : 'New'}"></li>
            </ol>
        </nav>
        <h1 class="h3 fw-bold" th:text="${pageTitle}"></h1>
    </div>

    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
        <i class="bi bi-exclamation-triangle me-2"></i>
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body p-4">
            <form th:action="${brand.id != null ? '/itams/brands/' + brand.id : '/itams/brands'}"
                  th:object="${brand}" method="post">

                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="name" class="form-label fw-semibold">
                            Brand Name <span class="text-danger">*</span>
                        </label>
                        <input type="text" class="form-control" id="name" th:field="*{name}"
                               th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"
                               placeholder="e.g., Dell, HP, Lenovo" required>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                    </div>

                    <div class="col-md-6">
                        <label for="website" class="form-label fw-semibold">Website</label>
                        <input type="url" class="form-control" id="website" th:field="*{website}"
                               placeholder="https://www.dell.com">
                    </div>

                    <div class="col-12">
                        <label for="description" class="form-label fw-semibold">Description</label>
                        <textarea class="form-control" id="description" th:field="*{description}"
                                  rows="3" placeholder="Optional description"></textarea>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold d-block">Status</label>
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" id="isActive" th:field="*{isActive}">
                            <label class="form-check-label" for="isActive">Active</label>
                        </div>
                    </div>
                </div>

                <div class="mt-4 d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-circle me-2"></i>
                        <span th:text="${brand.id != null ? 'Update' : 'Create'}"></span>
                    </button>
                    <a href="/itams/brands" class="btn btn-outline-secondary">
                        <i class="bi bi-x-circle me-2"></i>Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>
</main>
</body>
</html>
