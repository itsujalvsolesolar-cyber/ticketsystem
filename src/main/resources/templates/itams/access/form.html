<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${pageTitle})}"></head>
<body>
<div th:replace="~{fragments/layout :: sidebar}"></div>

<main class="main-content">
    <div class="page-header mb-4">
        <nav aria-label="breadcrumb" class="mb-2">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/itams/access">Digital Access</a></li>
                <li class="breadcrumb-item active">Grant Access</li>
            </ol>
        </nav>
        <h1 class="h3 fw-bold">Grant Digital Access</h1>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body p-4">
            <form th:action="@{/itams/access}" method="post">
                <!-- CSRF Token -->
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="employeeId" class="form-label fw-semibold">
                            Employee <span class="text-danger">*</span>
                        </label>
                        <select class="form-select" id="employeeId" name="employeeId" required>
                            <option value="">Select Employee</option>
                            <option th:each="emp : ${employees}" 
                                    th:value="${emp.id}" 
                                    th:text="${emp.fullName} + (${emp.department != null} ? ' - ' + ${emp.department} : '')">
                            </option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label for="accessType" class="form-label fw-semibold">
                            Access Type <span class="text-danger">*</span>
                        </label>
                        <select class="form-select" id="accessType" name="accessType" required>
                            <option value="">Select Type</option>
                            <option th:each="type : ${accessTypes}" th:value="${type}" th:text="${type.displayName}"></option>
                        </select>
                    </div>

                    <div class="col-12">
                        <label for="accessDetails" class="form-label fw-semibold">
                            Access Details <span class="text-danger">*</span>
                        </label>
                        <input type="text" class="form-control font-monospace" id="accessDetails" name="accessDetails" 
                               placeholder="e.g., Username, Folder Path (\\NAS\HR), IP Address, Printer Name" required>
                        <div class="form-text">Enter the specific username, path, or identifier for this access.</div>
                    </div>

                    <div class="col-12">
                        <label for="remarks" class="form-label fw-semibold">Remarks</label>
                        <textarea class="form-control" id="remarks" name="remarks" rows="3" 
                                  placeholder="e.g., Read-only access to HR shared drive"></textarea>
                    </div>
                </div>

                <div class="mt-4 d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-shield-check me-2"></i>Grant Access
                    </button>
                    <a href="/itams/access" class="btn btn-outline-secondary">
                        <i class="bi bi-x-circle me-2"></i>Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>
</main>
</body>
</html>
