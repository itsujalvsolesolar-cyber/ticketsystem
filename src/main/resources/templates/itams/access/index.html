<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${pageTitle})}"></head>
<body>
<div th:replace="~{fragments/layout :: sidebar}"></div>

<main class="main-content">
    <div class="page-header mb-4">
        <div class="d-flex justify-content-between align-items-center">
            <div>
                <h1 class="h3 fw-bold mb-1">Digital Access Management</h1>
                <p class="text-secondary mb-0">Manage AD, VPN, NAS, and network access</p>
            </div>
            <a href="/itams/access/new" class="btn btn-primary">
                <i class="bi bi-plus-circle me-2"></i>Grant Access
            </a>
        </div>
    </div>

    <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
        <i class="bi bi-check-circle me-2"></i><span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                    <tr>
                        <th class="ps-4">Access Type</th>
                        <th>Employee</th>
                        <th>Access Details</th>
                        <th>Assigned Date</th>
                        <th>Remarks</th>
                        <th class="text-end pe-4">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="access : ${accessRecords}">
                        <td class="ps-4">
                            <span class="badge bg-primary-subtle text-primary-emphasis" th:text="${access.accessType.displayName}"></span>
                        </td>
                        <td class="fw-semibold" th:text="${access.employee.fullName}"></td>
                        <td class="font-monospace small" th:text="${access.accessDetails ?: '-'}"></td>
                        <td class="small text-secondary" th:text="${#temporals.format(access.assignedDate, 'dd MMM yyyy')}"></td>
                        <td class="small text-truncate" style="max-width: 200px;" th:text="${access.remarks ?: '-'}"></td>
                        <td class="text-end pe-4">
                            <form th:action="@{/itams/access/{id}/revoke(id=${access.id})}" 
                                  method="post" class="d-inline"
                                  onsubmit="return confirm('Revoke this digital access?')">
                                <button type="submit" class="btn btn-outline-danger btn-sm">
                                    <i class="bi bi-x-circle me-1"></i>Revoke
                                </button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(accessRecords)}">
                        <td colspan="6" class="text-center py-4 text-secondary">
                            <i class="bi bi-inbox fs-4 d-block mb-2"></i>
                            No digital access records found.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
