<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Asset Categories')}"></head>
<body>
<div th:replace="~{fragments/layout :: sidebar}"></div>

<main class="main-content">
    <div class="page-header mb-4">
        <div class="d-flex justify-content-between align-items-center">
            <div>
                <h1 class="h3 fw-bold mb-1">Asset Categories</h1>
                <p class="text-secondary mb-0">Manage IT asset categories and prefixes</p>
            </div>
            <a href="/itams/categories/new" class="btn btn-primary">
                <i class="bi bi-plus-circle me-2"></i>New Category
            </a>
        </div>
    </div>

    <!-- Success/Error Messages -->
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
        <i class="bi bi-check-circle me-2"></i>
        <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
        <i class="bi bi-exclamation-triangle me-2"></i>
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Statistics Cards -->
    <div class="row g-3 mb-4">
        <div class="col-md-4">
            <div class="card border-0 shadow-sm">
                <div class="card-body">
                    <div class="d-flex align-items-center">
                        <div class="analytics-icon bg-primary-subtle text-primary me-3">
                            <i class="bi bi-tags"></i>
                        </div>
                        <div>
                            <h3 class="fw-bold mb-0" th:text="${totalCategories}">0</h3>
                            <p class="text-secondary small mb-0">Total Categories</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card border-0 shadow-sm">
                <div class="card-body">
                    <div class="d-flex align-items-center">
                        <div class="analytics-icon bg-success-subtle text-success me-3">
                            <i class="bi bi-check-circle"></i>
                        </div>
                        <div>
                            <h3 class="fw-bold mb-0" th:text="${activeCategories}">0</h3>
                            <p class="text-secondary small mb-0">Active Categories</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Categories Table -->
    <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                    <tr>
                        <th class="ps-4">ID</th>
                        <th>Name</th>
                        <th>Prefix</th>
                        <th>Default Warranty</th>
                        <th>Status</th>
                        <th>Created</th>
                        <th class="text-end pe-4">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="category : ${categories}">
                        <td class="ps-4 fw-bold text-secondary" th:text="${category.id}"></td>
                        <td>
                            <div class="fw-semibold" th:text="${category.name}"></div>
                            <div class="text-secondary small" th:text="${category.description}"></div>
                        </td>
                        <td>
                            <span class="badge bg-primary-subtle text-primary-emphasis" th:text="${category.prefix}"></span>
                        </td>
                        <td>
                            <span th:text="${category.defaultWarrantyMonths}"></span> months
                        </td>
                        <td>
                            <span th:if="${category.isActive}" class="badge bg-success-subtle text-success-emphasis">
                                <i class="bi bi-check-circle"></i> Active
                            </span>
                            <span th:unless="${category.isActive}" class="badge bg-secondary-subtle text-secondary-emphasis">
                                <i class="bi bi-x-circle"></i> Inactive
                            </span>
                        </td>
                        <td>
                            <div class="small" th:text="${#temporals.format(category.createdAt, 'dd MMM yyyy')}"></div>
                        </td>
                        <td class="text-end pe-4">
                            <div class="btn-group btn-group-sm">
                                <a th:href="@{/itams/categories/{id}/edit(id=${category.id})}"
                                   class="btn btn-outline-primary btn-icon" data-bs-toggle="tooltip" title="Edit">
                                    <i class="bi bi-pencil"></i>
                                </a>
                                <form th:action="@{/itams/categories/{id}/delete(id=${category.id})}"
                                      method="post" class="d-inline"
                                      onsubmit="return confirm('Are you sure you want to deactivate this category?')">
                                    <button type="submit" class="btn btn-outline-danger btn-icon" data-bs-toggle="tooltip" title="Deactivate">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        var tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'));
        tooltipTriggerList.map(function (el) {
            return new bootstrap.Tooltip(el);
        });
    });
</script>
</body>
</html>
