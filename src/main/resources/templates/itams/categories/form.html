<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${pageTitle})}"></head>
<body>
<div th:replace="~{fragments/layout :: sidebar}"></div>

<main class="main-content">
    <div class="page-header mb-4">
        <nav aria-label="breadcrumb" class="mb-2">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/itams/categories">Categories</a></li>
                <li class="breadcrumb-item active" th:text="${category.id != null ? 'Edit' : 'New'}"></li>
            </ol>
        </nav>
        <h1 class="h3 fw-bold" th:text="${category.id != null ? 'Edit Category' : 'Create New Category'}"></h1>
    </div>

    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
        <i class="bi bi-exclamation-triangle me-2"></i>
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body p-4">
            <form th:action="${category.id != null ? '/itams/categories/' + category.id : '/itams/categories'}"
                  th:object="${category}" method="post">

                <div class="row g-3">
                    <!-- Category Name -->
                    <div class="col-md-6">
                        <label for="name" class="form-label fw-semibold">
                            Category Name <span class="text-danger">*</span>
                        </label>
                        <input type="text" class="form-control" id="name" th:field="*{name}"
                               th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"
                               placeholder="e.g., Laptop, Desktop, Printer" required>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                    </div>

                    <!-- Prefix -->
                    <div class="col-md-6">
                        <label for="prefix" class="form-label fw-semibold">
                            Asset Tag Prefix <span class="text-danger">*</span>
                        </label>
                        <input type="text" class="form-control" id="prefix" th:field="*{prefix}"
                               th:classappend="${#fields.hasErrors('prefix')} ? 'is-invalid'"
                               placeholder="e.g., LT, DS, PR" required>
                        <div class="form-text">2-5 uppercase letters used for asset tag generation</div>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('prefix')}" th:errors="*{prefix}"></div>
                    </div>

                    <!-- Description -->
                    <div class="col-12">
                        <label for="description" class="form-label fw-semibold">Description</label>
                        <textarea class="form-control" id="description" th:field="*{description}"
                                  rows="3" placeholder="Optional description of this category"></textarea>
                    </div>

                    <!-- Default Warranty -->
                    <div class="col-md-6">
                        <label for="defaultWarrantyMonths" class="form-label fw-semibold">
                            Default Warranty (Months)
                        </label>
                        <input type="number" class="form-control" id="defaultWarrantyMonths"
                               th:field="*{defaultWarrantyMonths}" min="0" max="120">
                        <div class="form-text">Default warranty period for assets in this category</div>
                    </div>

                    <!-- Active Status -->
                    <div class="col-md-6">
                        <label class="form-label fw-semibold d-block">Status</label>
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" id="isActive"
                                   th:field="*{isActive}">
                            <label class="form-check-label" for="isActive">
                                Active
                            </label>
                        </div>
                        <div class="form-text">Inactive categories won't appear in dropdowns</div>
                    </div>
                </div>

                <div class="mt-4 d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-circle me-2"></i>
                        <span th:text="${category.id != null ? 'Update' : 'Create'}"></span>
                    </button>
                    <a href="/itams/categories" class="btn btn-outline-secondary">
                        <i class="bi bi-x-circle me-2"></i>Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
